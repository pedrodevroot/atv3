name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    name: Lint, tipos, build e unitários (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:desempenho
      - run: npm run demo

  integracao:
    name: Integração com PostgreSQL e cobertura
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run db:up
      - run: npm run coverage

  stack-docker:
    name: Subida da stack Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: curl --fail http://localhost:3000/health
      - run: docker compose down -v
